apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/tracking-id: hlb:argoproj.io/Application:hlb/argocd
  name: sealed-secrets
  namespace: hlb
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    targetRevision: 2.22.0
    chart: sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: hlb
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
