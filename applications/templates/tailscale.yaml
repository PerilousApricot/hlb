apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale
  namespace: hlb
spec:
  destination:
    namespace: hlb
    server: https://kubernetes.default.svc
  project: default
  sources:
  - repoURL: https://pkgs.tailscale.com/helmcharts
    targetRevision: 1.104.7
    helm:
      parameters:
        # Will be overridden by sealed secret
        - name: oauth.clientId
          value: 123ABC
        - name: oauth.clientSecret
          value: ABC123
    chart: tailscale-operator
  - path: applications-content/tailscale/overlays/{{ .Values.variant }}
    repoURL: https://github.com/perilousApricot/hlb
    targetRevision: HEAD
