apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: hlb
spec:
  destination:
    namespace: hlb
    server: https://kubernetes.default.svc
  project: default
  source:
    path: bootstrap
    repoURL: https://github.com/perilousApricot/hlb
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
