apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hlb
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  - namespace.yaml

patches:
  - path: enable_helm.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: hlb
    target:
      kind: ClusterRoleBinding
