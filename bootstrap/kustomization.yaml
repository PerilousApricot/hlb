apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
- name: argo-cd
  includeCRDs: true
  valuesInline:
    global:
      domain: argocd.partymansion.biz
      dualStack: 
        ipFamilyPolicy: PreferDualStack
    server:
      ingress:
        enabled: true
        tls: true
        ingressClassName: haproxy
      ingressGrpc:
        enabled: true
        tls: true
        ingressClassName: haproxy

  releaseName: argocd
  version: 10.2.2
  repo: https://argoproj.github.io/argo-helm

patches:
  - path: enable_helm.yaml

namespace: hlb

